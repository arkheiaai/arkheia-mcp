name: Smoke Test — MCP Server E2E

on:
  # The default branch of this repo is `master`. This workflow used to trigger on
  # [main, staging] — branches that do not exist here — so its push/pull_request
  # triggers could NEVER fire. It did still run weekly via `schedule` (which runs
  # against the default branch), so it was not dead; what it could never do is
  # GATE A COMMIT. See PR body item 1.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '23 7 * * 1'  # Monday 07:23 UTC (off-minute)
  workflow_dispatch:

jobs:
  smoke:
    name: MCP server end-to-end smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # Pin: actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r mcp_server/requirements.txt
          # NO ad-hoc installs — pytest/pytest-asyncio/pytest-timeout are declared
          # in requirements.txt. Enforced by tests/test_ci_enforcement_floor.py.

      - name: Run smoke tests
        env:
          JWT_SECRET: "ci-test-secret-not-for-production-use-minimum-32chars!!"
          ARKHEIA_API_KEY: ${{ secrets.ARKHEIA_API_KEY }}
        run: |
          pytest tests/test_smoke_e2e.py -v --timeout=60
