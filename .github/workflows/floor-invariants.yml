name: Floor Invariants

# Deterministic FLOOR TIER: stdlib-only invariants run under a bare `pytest`
# with ZERO project dependencies, so there is no interpreter variance. These
# encode "stop the bleeding" build-quality invariants grounded in real defects
# of this repo. Collection is restricted to test_*_floor.py / test_floor_*.py.

on:
  # merge_group ADDED 2026-07-30 — `master` has `strict: true` (branches must be up to date before
  # merging), so every merge voids every other open PR and the green count cannot advance. A GitHub
  # merge queue fixes that, but the queue dispatches CI on the `merge_group` event against a
  # `gh-readonly-queue/master/**` branch, and `push` below is filtered to `branches: [master]`. Without
  # this trigger the REQUIRED context would never post on a queued PR: it would sit at
  # "Expected — waiting" until GitHub's status-check timeout evicted it.
  merge_group:
    branches: [master]
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  floor:
    name: floor-invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # Aikido LOW: a checkout that keeps the token in .git/config leaves it
          # readable by every later step, including the real `npm pack` this job
          # runs, which executes repo-authored build scripts. This job never
          # pushes, so the credential has no purpose here.
          persist-credentials: false

      - name: Set up Python
        # Pin: actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install pytest ONLY (floor tier uses stdlib + pytest, nothing else)
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # `tests/test_packed_artifact_floor.py` produces the REAL published artifact
      # (`npm pack`) and reads the tarball, because the defect it was earned by was
      # invisible to every check that read the build script instead. That needs npm.
      # Pinned rather than relying on whatever the runner image happens to ship, and
      # >=18 to match npm-wrapper/package.json `engines.node`. If npm is missing the
      # floor FAILS rather than skips — a skipped artifact check is indistinguishable
      # from a passing one.
      - name: Set up Node (the packed-artifact floor runs a real `npm pack`)
        # Pin: actions/setup-node v4.1.0
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      - name: Confirm the artifact toolchain is present
        # Names the units of work before the floor runs. A floor tier that lost npm
        # would otherwise fail with a confusing import-time error rather than a
        # legible "the toolchain is missing" line.
        run: |
          node --version
          npm --version

      - name: Confirm floor discovery count
        # A floor file deleted or renamed out of discovery must fail loudly. Re-measured on
        # PR #64 after expanding tests/test_mcp_httpx_custody_floor.py from mcp_server-only
        # to mcp_server+proxy outbound custody, then reconciling with PR #60's
        # shared egress factory floor:
        # 214 collected.
        # Re-measured on PR #69 when master was merged in: master had since landed
        # tests/test_memory_db_path_floor.py, tests/test_tool_gate_floor.py,
        # tests/test_merge_queue_triggers_floor.py, tests/test_admin_audit_auth_floor.py,
        # tests/test_proxy_dotenv_secret_source_floor.py and a rewritten, repo-rooted
        # tests/test_mcp_httpx_custody_floor.py. The count is raised to the measured
        # value, which is what this guard's own error message instructs; the guard
        # itself is unchanged and still fails loudly on any future drift:
        # 248 collected.
        # Re-measured on PR #31 (F11 passthrough) when master was merged in: this
        # branch adds tests/test_passthrough_ssrf_floor.py (the SSRF containment
        # invariants, including one new discovery self-test proving INV-3 still
        # finds the client construction now that it is spelled through
        # arkheia_common.egress_async_client). Measured with a bare pytest-only
        # interpreter, the same way this job runs it, and raised to the measured
        # value as the guard's own error message instructs; the guard is unchanged
        # and still fails loudly on any future drift:
        # 310 collected.
        run: |
          COUNT="$(pytest tests \
            -o python_files="test_*_floor.py test_floor_*.py" \
            -p no:cacheprovider --collect-only -q 2>/dev/null | grep -c '::' || true)"
          EXPECTED=321
          if [ "$COUNT" -ne "$EXPECTED" ]; then
            echo "::error::floor discovery count changed (collected $COUNT, expected $EXPECTED). If intentional, update EXPECTED in this workflow in the same commit."
            exit 1
          fi

      - name: Run floor invariants
        # Override python_files so ONLY floor tests are collected; a bare pytest
        # must never try to import dependency-heavy suites. Empty collection
        # (exit 5) fails the job — the floor tier must always carry an invariant.
        run: |
          pytest tests \
            -o python_files="test_*_floor.py test_floor_*.py" \
            -p no:cacheprovider -v
