name: Unit Tests

# Runs the repo's existing (but previously dormant) unit suites on every push
# and PR to the DEFAULT branch (master). Note: smoke-test.yml / security_scan.yml
# target `main`/`staging`, so before this workflow only CodeQL ran on master PRs
# and these suites never executed in CI. This job makes them a real gate.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  unit:
    name: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # Pin: actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r mcp_server/requirements.txt
          # NO ad-hoc installs. cryptography / python-dotenv / respx /
          # pytest-timeout are now DECLARED in requirements.txt. Installing them
          # here instead meant CI green did not prove the declared manifest could
          # run the suite — the workflow papered over its own dependency gap.
          # Enforced by tests/test_ci_enforcement_floor.py (INV-2).

      - name: Run hermetic unit suites
        env:
          # Hermetic, non-secret test value (mirrors smoke-test.yml). No live
          # secrets are used: any suite that needs them self-skips.
          JWT_SECRET: "ci-test-secret-not-for-production-use-minimum-32chars!!"
        run: |
          # tests/test_smoke_e2e.py is NO LONGER --ignore'd. It was doubly
          # orphaned: --ignore'd here AND its own workflow (smoke-test.yml) only
          # triggered on `main`, a branch that does not exist -- so NO required
          # status context could ever collect it. Its first two stages are fully
          # hermetic (real `python -m mcp_server.server` subprocess over stdio,
          # no secrets, no live services, 2.1s for 5 tests) and are the only
          # end-to-end proof that the shipped MCP server starts, completes the
          # MCP initialize handshake, and advertises all 9 documented tools.
          # Stages 3 and 4 self-skip (hosted API key / local proxy on :8098).
          # `-rs` makes every skip reason appear in the summary of this REQUIRED
          # job, so a not-observed stage cannot hide. See PR body items 3 and 4.
          pytest \
            proxy/tests \
            mcp_server/tests \
            registry_server/tests \
            tests \
            -v -rs --timeout=120
