name: Security Scan

on:
  # The default branch of this repo is `master`. This workflow used to trigger on
  # [main, staging] — branches that do not exist here — so its push/pull_request
  # triggers could NEVER fire. It did still run weekly via `schedule` (which runs
  # against the default branch), so it was not dead; what it could never do is
  # GATE A COMMIT. See PR body item 1.
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 6am UTC
  workflow_dispatch:

jobs:
  bandit:
    name: Bandit static analysis
    runs-on: ubuntu-latest
    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # Pin: actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run bandit (source only, skip tests and venv)
        run: |
          bandit -r proxy/ mcp_server/ registry_server/ scripts/ \
            --exclude proxy/tests,mcp_server/tests,registry_server/tests \
            --skip B101,B601 \
            -f json -o bandit-results.json || true
          bandit -r proxy/ mcp_server/ registry_server/ scripts/ \
            --exclude proxy/tests,mcp_server/tests,registry_server/tests \
            --skip B101,B601 \
            -ll 2>&1 | tee bandit-summary.txt
          # Fail on HIGH severity only
          if grep -q "Severity: High" bandit-summary.txt; then
            echo "HIGH severity findings detected"
            exit 1
          fi

      - name: Upload results
        if: always()
        # Pin: actions/upload-artifact v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: bandit-results-${{ github.run_number }}
          path: |
            bandit-results.json
            bandit-summary.txt
          retention-days: 90

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # Pin: actions/setup-python v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          set -o pipefail
          pip install -r requirements.txt --dry-run 2>/dev/null || true
          set +e
          pip-audit -r requirements.txt --format json -o pip-audit-results.json
          audit_json_status=$?
          pip-audit -r requirements.txt 2>&1 | tee pip-audit-summary.txt
          audit_summary_status=$?
          set -e
          if [ ! -s pip-audit-results.json ]; then
            echo "pip-audit did not produce a JSON report"
            exit 1
          fi
          # pip-audit 2.10.1 does not expose CVSS scores in JSON and has no
          # --fail-on-cvss flag, so this gate fails closed on any reported vuln.
          python - <<'PY'
          import json
          import sys

          with open("pip-audit-results.json", encoding="utf-8") as f:
              report = json.load(f)
          findings = []
          for dep in report.get("dependencies", []):
              for vuln in dep.get("vulns", []):
                  aliases = ", ".join(vuln.get("aliases", [])) or "no aliases"
                  findings.append(
                      f"{dep.get('name')} {dep.get('version', '?')}: "
                      f"{vuln.get('id')} ({aliases})"
                  )
          if findings:
              print("pip-audit reported vulnerabilities:")
              for finding in findings:
                  print(f"  - {finding}")
              sys.exit(1)
          print("pip-audit reported no vulnerabilities")
          PY
          if [ "$audit_json_status" -ne 0 ] || [ "$audit_summary_status" -ne 0 ]; then
            echo "pip-audit exited non-zero without JSON findings; failing closed"
            exit 1
          fi

      - name: Upload results
        if: always()
        # Pin: actions/upload-artifact v4.4.3
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: pip-audit-results-${{ github.run_number }}
          path: |
            pip-audit-results.json
            pip-audit-summary.txt
          retention-days: 90

  secrets-check:
    name: Check for committed secrets
    runs-on: ubuntu-latest
    steps:
      # Pin: actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0   # full history for secret scanning

      - name: Scan for secrets with trufflehog
        # Pin: trufflesecurity/trufflehog v3.88.22
        uses: trufflesecurity/trufflehog@34339eaf08bf5c2a27dbd969812127721f3743ed  # v3.88.22
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
