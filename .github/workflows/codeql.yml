name: CodeQL Security Scan
on:
  # merge_group ADDED 2026-07-30 — `master` has `strict: true` (branches must be up to date before
  # merging), so every merge voids every other open PR and the green count cannot advance. A GitHub
  # merge queue fixes that, but the queue dispatches CI on the `merge_group` event against a
  # `gh-readonly-queue/master/**` branch, and `push` below is filtered to `branches: [master]`. Without
  # this trigger the REQUIRED context would never post on a queued PR: it would sit at
  # "Expected — waiting" until GitHub's status-check timeout evicted it.
  merge_group:
    branches: [master]
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'  # Monday 6am UTC

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3
